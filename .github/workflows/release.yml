name: release

# Every main commit that passes ci gets a GitHub release with ready-built nexo files and their SHA-256
# list, so the install scripts and `nexo update` download in seconds instead of compiling.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux files are static (musl): they run on any distribution, old or new
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: nexo-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: nexo-linux-aarch64 }
          # Windows files carry their C runtime: nothing else to install
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: nexo-windows-x86_64.exe }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, asset: nexo-windows-aarch64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: nexo
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl compiler
        if: contains(matrix.target, 'musl')
        # the runner's name lookups fail now and then: try Ubuntu's musl-gcc for a few minutes, then
        # build with zig, which comes from PyPI and needs nothing from Ubuntu's servers
        run: |
          for n in 1 2 3 4; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools; then
              t=$(echo "${{ matrix.target }}" | tr - _)
              echo "CC_$t=musl-gcc" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "attempt $n failed, waiting"
            sleep $((n * 20))
          done
          echo "Ubuntu's servers do not answer: building with zig"
          python3 -m venv "$HOME/zig" && "$HOME/zig/bin/pip" install --quiet ziglang cargo-zigbuild
          echo "$HOME/zig/bin" >> "$GITHUB_PATH"
          echo "BUILD=zigbuild" >> "$GITHUB_ENV"
      - name: build
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo ${BUILD:-build} --release --locked -p nexo-cli --target ${{ matrix.target }}
      - name: collect
        run: |
          src="target/${{ matrix.target }}/release/nexo"
          case "${{ matrix.target }}" in *windows*) src="$src.exe" ;; esac
          mkdir -p ../out
          cp "$src" "../out/${{ matrix.asset }}"
          ../out/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    # a system whose build failed is left out; the scripts build from source there
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: licence files
        # LICENSE and the third-party notices travel with every release (not part of SHA256SUMS: that list is for the nexo files)
        run: |
          cp LICENSE out/LICENSE
          nexo/tools/notices.sh out/THIRD-PARTY-NOTICES.txt
      - name: publish
        working-directory: out
        run: |
          ls nexo-* >/dev/null 2>&1 || { echo "no build succeeded"; exit 1; }
          sha256sum nexo-* > SHA256SUMS
          cat SHA256SUMS
          tag="build-${SHA::7}"
          # only a build that no other build is newer than may become "latest": a run for an older commit
          # that finishes last must not take the label from a newer one
          latest=true
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" -L 50 --json tagName -q '.[].tagName | select(startswith("build-"))'); do
            [ "$t" = "$tag" ] && continue
            o=$(gh release view "$t" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish) || continue
            st=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$o" -q .status) || continue
            if [ "$st" = ahead ]; then latest=false; fi
          done
          echo "latest=$latest"
          publish() {
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" nexo-* SHA256SUMS LICENSE THIRD-PARTY-NOTICES.txt --clobber --repo "$GITHUB_REPOSITORY" &&
                gh release edit "$tag" --latest="$latest" --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$tag" nexo-* SHA256SUMS LICENSE THIRD-PARTY-NOTICES.txt --repo "$GITHUB_REPOSITORY" --target "$SHA" \
                --title "nexo ${SHA::7}" --latest="$latest" \
                --notes "Ready-built nexo for commit $SHA. Install or update: see the README (the install scripts and \`nexo update\` download these files and check them against SHA256SUMS)."
            fi
          }
          # a failed call (403, 5xx, a release another run just made) is retried; a half-made release is completed
          ok=false
          for i in 1 2 3 4 5; do
            if publish; then ok=true; break; fi
            echo "publish attempt $i failed"; sleep $((i * 20))
          done
          $ok
      - name: keep the last 5 builds
        # install.sh and `nexo update` only read releases/latest; the last few stay for going back
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" -L 500 --json tagName,createdAt,isLatest \
            -q '[.[] | select((.tagName | startswith("build-")) and (.isLatest | not))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag -y --repo "$GITHUB_REPOSITORY"; done
