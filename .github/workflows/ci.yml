name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nexo:
    # nexo is built and tested on Linux and Windows on every push
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # the interface tests draw in 24-bit colour, as on the terminals nexo targets (a runner sets no TERM)
    env:
      COLORTERM: truecolor
    defaults:
      run:
        working-directory: nexo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexo
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo build --workspace
      - run: cargo test --workspace --no-fail-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
