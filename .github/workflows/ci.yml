name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nexo:
    # nexo is built and tested on Linux, macOS (Apple silicon) and Windows on every push
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS is new here: its job reports but does not fail the run until it has been green on main (then delete this line)
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    # the interface tests draw in 24-bit colour, as on the terminals nexo targets (a runner sets no TERM)
    env:
      COLORTERM: truecolor
    defaults:
      run:
        working-directory: nexo
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexo
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      - run: cargo build --workspace
      - run: cargo test --workspace --no-fail-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: the Intel Mac build still compiles (the release builds it natively)
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin && cargo check --workspace --target x86_64-apple-darwin

  msrv:
    # the oldest Rust nexo supports (rust-version in nexo/Cargo.toml) builds and tests it with the locked dependencies
    runs-on: ubuntu-latest
    env:
      COLORTERM: truecolor
    defaults:
      run:
        working-directory: nexo
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexo
      - run: cargo test --workspace --locked --no-fail-fast
