name: ci

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same pull request makes the older run obsolete. Runs on main are never cancelled because release.yml
# builds only from a successful run: each main commit gets its own group (a shared group would cancel a queued run when a
# newer one arrives, even with cancel-in-progress off), so main pushes also keep running in parallel
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nexo:
    # nexo is built and tested on Linux and Windows on every push; macOS runs here too but is not claimed as tested until it is green
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS is new here: its job reports but does not fail the run until it has been green on main (then delete this line)
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    # the interface tests draw in 24-bit colour, as on the terminals nexo targets (a runner sets no TERM)
    env:
      COLORTERM: truecolor
    defaults:
      run:
        working-directory: nexo
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexo
      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
      # the debugger's 32-bit tests build their programs with `gcc -m32`; without the multilib headers they return early
      # and check nothing
      - name: 32-bit C headers and libraries for the debugger's 32-bit tests
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-multilib
      - run: cargo build --workspace
      - run: cargo test --workspace --no-fail-fast
      # a failed test step must not hide clippy or the Intel check, so these two run after it either way; --keep-going so one failing target does not hide the lints of the others
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
        if: success() || failure()
      - name: the Intel Mac build still compiles (the release builds it natively)
        if: (success() || failure()) && matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin && cargo check --workspace --target x86_64-apple-darwin

  msrv:
    # the oldest Rust nexo supports (rust-version in nexo/Cargo.toml) must still compile nexo with the locked dependencies; the
    # full test suite runs on the stable jobs above, so this job checks the build and does not run the tests
    runs-on: ubuntu-latest
    env:
      COLORTERM: truecolor
    defaults:
      run:
        working-directory: nexo
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nexo
      # check, not test: the stable Linux job already runs the suite, and --all-targets keeps the test code covered by the oldest compiler
      - run: cargo check --workspace --locked --all-targets

  deny:
    # dependency policy in nexo/deny.toml. A new advisory appears without any change of ours, so it reports but must not block a
    # release; the bans, licenses and sources checks only change when the dependencies change, so they gate like any other job
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    steps:
      - uses: actions/checkout@v5
      # pinned to a full commit SHA: this action runs a downloaded binary, so a moved tag must not change what runs
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          manifest-path: nexo/Cargo.toml
          command: check ${{ matrix.checks }}
          arguments: --all-features --locked
