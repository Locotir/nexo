name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove API keys and private code from anything you paste. For a security problem use the Security tab instead.
  - type: input
    id: version
    attributes:
      label: Output of `nexo --version`
      placeholder: "0.1.0 (abc1234)"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and terminal
      placeholder: "Ubuntu 24.04, Alacritty"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model
      placeholder: "deepseek, deepseek-v4-pro"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
