name: Feature request
description: Suggest something nexo could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like nexo to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
