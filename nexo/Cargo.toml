[workspace]
resolver = "2"
members = [
    "crates/nexo-core",
    "crates/nexo-providers",
    "crates/nexo-tools",
    "crates/nexo-curator",
    "crates/nexo-agent",
    "crates/nexo-tui",
    "crates/nexo-bin",
    "crates/nexo-dbg",
    "crates/nexo-browser-host",
    "crates/nexo-cli",
    "crates/nexo-bench",
    "crates/nexo-browser",
    "crates/nexo-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Locotir/nexo"

# One version of everything, declared once. A crate takes what it needs with
# `name = { workspace = true }` and never pins a version of its own.
[workspace.dependencies]
nexo-core = { path = "crates/nexo-core" }
nexo-providers = { path = "crates/nexo-providers" }
nexo-tools = { path = "crates/nexo-tools" }
nexo-curator = { path = "crates/nexo-curator" }
nexo-agent = { path = "crates/nexo-agent" }
nexo-tui = { path = "crates/nexo-tui" }
nexo-bench = { path = "crates/nexo-bench" }
nexo-bin = { path = "crates/nexo-bin" }
nexo-dbg = { path = "crates/nexo-dbg" }
nexo-browser = { path = "crates/nexo-browser" }
nexo-relay = { path = "crates/nexo-relay" }
nexo-browser-host = { path = "crates/nexo-browser-host" }

# runtime
tokio = { version = "1.54", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros", "local-offset"] }
base64 = "0.23"
sha2 = "0.10"
bytes = "1"

# errors and logs
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# http
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "gzip"] }
webpki-root-certs = "1"
url = "2"
htmd = "0.5"

# browser control (nexo-browser): Chrome DevTools Protocol client, pure Rust
chromiumoxide = "0.9"

# binary files (nexo-bin): read ELF and PE as bytes, decode x86-64, demangle names
miniz_oxide = "0.8"
object = { version = "0.41", default-features = false, features = ["read", "std"] }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "encoder", "op_code_info", "intel", "instr_info"] }
rustc-demangle = "0.1"
# WebAssembly modules (pure Rust, no validation or component model)
wasmparser = { version = "0.228", default-features = false, features = ["std", "simd"] }
cpp_demangle = "0.5"
msvc-demangler = "0.11"
pdb = "0.8"

# debugger (nexo-dbg): unwind and line tables come from the shared gimli above; the Win32 Debug API on Windows
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# files and search
dirs = "7"
globset = "0.4"
ignore = "0.4"
regex = "1"
fancy-regex = "0.16"
rustc-hash = "2"
indexmap = "2"
similar = { version = "3", features = ["text", "inline", "unicode"] }
libc = "0.2"
landlock = "0.4"
tempfile = "3"

# terminal
ratatui = "0.29"
crossterm = { version = "0.28", features = ["use-dev-tty"] }
tui-textarea = "0.7"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
nucleo-matcher = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# tests
httpmock = "0.9"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# the curator replays whole conversations in its tests: optimised, they run in a fraction of the time
[profile.dev.package.nexo-curator]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
# nexo-dbg's tests read the fixture program's own DWARF line table, so keep line info on this crate even when the build strips debug to stay lean
[profile.dev.package.nexo-dbg]
opt-level = 2
debug = "line-tables-only"
