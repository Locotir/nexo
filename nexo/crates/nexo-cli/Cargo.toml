[package]
name = "nexo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "nexo: the terminal coding harness (binary)"

[[bin]]
name = "nexo"
path = "src/main.rs"

[features]
# `nexo bench`, the benchmark (hidden subcommand); without it the binary is smaller and builds faster
default = ["bench"]
bench = ["dep:nexo-bench"]

[dependencies]
nexo-core = { workspace = true }
nexo-api = { workspace = true }
nexo-browser-host = { workspace = true }
nexo-providers = { workspace = true }
nexo-tools = { workspace = true }
nexo-agent = { workspace = true }
nexo-supervise = { workspace = true }
nexo-bin = { workspace = true }
nexo-dbg = { workspace = true }
nexo-tui = { workspace = true }
nexo-bench = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
toml_edit = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false }
rustls-native-certs = "0.8.5"
async-tungstenite = { version = "0.32.1", features = ["tokio-runtime", "tokio-rustls-native-certs"] }
tempfile = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
nexo-bin = { workspace = true, features = ["fixtures"] }
