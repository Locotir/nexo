[package]
name = "nexo-curator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "nexo: the context curator (goal engine) as a library"

[dependencies]
nexo-core = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
regex = { workspace = true }
fancy-regex = { workspace = true }
rustc-hash = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
# tests, examples and clippy --all-targets build with the simulator, so the default gate covers it; a
# normal build does not (dev-dependencies are not unified into it)
nexo-curator = { path = ".", features = ["sim"] }
tempfile = { workspace = true }

[features]
# the closed-loop session simulator (src/sim, examples/sim.rs, examples/replay.rs)
sim = []

[[example]]
name = "replay"
test = true
required-features = ["sim"]

[[example]]
name = "sim"
required-features = ["sim"]
