[package]
name = "nexo-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "nexo: the agent loop (turns, tools, permissions, sessions, cost, context policies)"

[dependencies]
nexo-core = { workspace = true }
nexo-providers = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }  # the curated brief reads its model exactly
regex = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
toml_edit = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }
url = { workspace = true }
nexo-curator = { workspace = true }
nexo-tools = { workspace = true }
nexo-supervise = { workspace = true }
nexo-binmagic = { workspace = true }
ignore = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }
nexo-dbg = { workspace = true }
nexo-bin = { workspace = true, features = ["fixtures"] }

# The cold-start debug test drives the debugger's own test program. An example of another package cannot be
# built for a test, so the same source is built here under a name of its own (it would clash with nexo-dbg's
# example in the shared examples folder otherwise) and `cargo test -p nexo-agent` has it before the test starts.
[[example]]
name = "dbg_target_cold"
path = "../nexo-dbg/examples/dbg_target.rs"
