[package]
name = "nexo-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "nexo: the agent loop (turns, tools, permissions, sessions, cost, context policies)"

[dependencies]
nexo-core = { workspace = true }
nexo-providers = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }  # the curated brief reads its model exactly
regex = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
toml = { workspace = true }
toml_edit = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
globset = { workspace = true }
url = { workspace = true }
nexo-curator = { workspace = true }
nexo-tools = { workspace = true }
nexo-bin = { workspace = true }
ignore = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
