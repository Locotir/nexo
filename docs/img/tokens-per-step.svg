<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Tokens sent per model call over one long conversation: plain, compacting, nexo</title>
<desc id="d">Recorded 119-call session (noisy-1104 marathon) replayed through nexo. Plain history grows to 122k. A harness that compacts at 40k to a 4k summary (simulated) drops 3 times, at calls 34, 59, 100, losing earlier detail and rebuilding the cache each time. nexo's curated view stays within 17k and 36k from call 33 on, stepping down at its epochs. Replayed 2026-11-10, nexo f1b104b.</desc>
