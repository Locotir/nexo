<text class="t3" x="56" y="330" font-size="11">model call number. Ticks: nexo epochs (8), the only calls that rewrite its prompt prefix; between them it only appends.</text>
<text class="t2" x="24" y="352" font-size="11.5">Circles 1 to 3: a compaction. Earlier detail is replaced by a 4k summary and the whole prefix is re-read as a cache miss.</text>
<text class="t2" x="24" y="368" font-size="11.5">Plain and nexo: recorded session (noisy-1104 marathon), replayed offline. Compacting line: simulated from the same session,</text>
<text class="t2" x="24" y="384" font-size="11.5">rule: when the next call would exceed 40k (80% of a 50k window), send a 4k summary instead, then add what the session adds.</text>
<text class="t3" x="24" y="400" font-size="11">Replayed 2026-11-10, nexo f1b104b. Token counts are the replay's estimate, y axis from 0.</text></svg>
