<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Measured on the same model. Against Claude Code: 40% fewer tokens, 15 of 15 runs cheaper. Against Codex CLI in one long session: 41% fewer input tokens, 0 compactions.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e14"/><stop offset="1" stop-color="#11141d"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3dffb0"/><stop offset="1" stop-color="#1bd4ff"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1bd4ff"/><stop offset="1" stop-color="#9d8cff"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d8cff"/><stop offset="1" stop-color="#ff6fb5"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6fb5"/><stop offset="1" stop-color="#ffc04d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dffb0"/><stop offset="0.35" stop-color="#1bd4ff"/><stop offset="0.7" stop-color="#9d8cff"/><stop offset="1" stop-color="#ff6fb5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="card"><rect width="880" height="400" rx="20"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
      .big { font-weight: 800; letter-spacing: -2px; }
      .lab { font-size: 16px; font-weight: 600; fill: #e6edf3; }
      .dim { font-size: 12.5px; fill: #8b949e; }
      .ttl { font-size: 18px; font-weight: 700; fill: #f0f3f6; }
      .up { animation: up 0.7s cubic-bezier(.2,.8,.2,1) both; }
      .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .dot { animation: pop 0.35s ease-out both; }
      .glow { animation: drift 14s ease-in-out infinite alternate; }
      .sheen { animation: sweep 7s ease-in-out 1.6s infinite; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s } .d4 { animation-delay: .75s }
      .b1 { animation-delay: .5s } .b2 { animation-delay: .7s } .b3 { animation-delay: .9s } .b4 { animation-delay: 1.1s }
      @keyframes up { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes pop { from { opacity: .12 } to { opacity: 1 } }
      @keyframes drift { from { transform: translate(0,0) } to { transform: translate(60px,-24px) } }
      @keyframes sweep { 0% { transform: translateX(0) } 45%, 100% { transform: translateX(1500px) } }
      @media (prefers-reduced-motion: reduce) { .up, .bar, .dot, .glow, .sheen { animation: none } .sheen { display: none } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="880" height="400" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="glow" cx="130" cy="60" r="120" fill="#12c98a"/>
      <circle class="glow" cx="780" cy="360" r="130" fill="#7a4dff" style="animation-direction: alternate-reverse"/>
      <circle class="glow" cx="470" cy="210" r="70" fill="#0aa0ff" opacity="0.5"/>
    </g>
    <g transform="skewX(-18)"><rect class="sheen" x="-320" y="-40" width="260" height="480" fill="url(#shine)"/></g>
  </g>
  <rect x="0.75" y="0.75" width="878.5" height="398.5" rx="19.5" fill="none" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="1.5"/>

  <text x="40" y="44" font-size="13" font-weight="700" letter-spacing="3.2" fill="#7ef0c4">SAME MODEL. SAME TASKS. MEASURED.</text>
  <text x="840" y="44" text-anchor="end" class="dim">2026-11-10</text>

  <!-- against Claude Code -->
  <rect x="28" y="62" width="404" height="284" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="50" y="96" class="ttl">vs Claude Code</text>
  <text x="412" y="96" text-anchor="end" class="dim">5 tasks × 3 runs</text>

  <g class="up d1">
    <text x="48" y="186" class="big" font-size="80" fill="url(#g1)">40%</text>
    <text x="50" y="216" class="lab">fewer tokens</text>
  </g>
  <rect x="50" y="238" width="170" height="8" rx="4" fill="#3a424d"/>
  <rect class="bar b1" x="50" y="254" width="103" height="8" rx="4" fill="url(#g1)"/>
  <text x="50" y="292" class="dim">3.65M against 6.04M</text>

  <g class="up d2">
    <text x="246" y="186" class="big" font-size="64" fill="url(#g2)">15/15</text>
    <text x="248" y="216" class="lab">runs cheaper</text>
  </g>
  <g fill="url(#g2)">
    <circle class="dot" cx="253" cy="250" r="4.5" style="animation-delay:.60s"/><circle class="dot" cx="264" cy="250" r="4.5" style="animation-delay:.68s"/>
    <circle class="dot" cx="275" cy="250" r="4.5" style="animation-delay:.76s"/><circle class="dot" cx="286" cy="250" r="4.5" style="animation-delay:.84s"/>
    <circle class="dot" cx="297" cy="250" r="4.5" style="animation-delay:.92s"/><circle class="dot" cx="308" cy="250" r="4.5" style="animation-delay:1.00s"/>
    <circle class="dot" cx="319" cy="250" r="4.5" style="animation-delay:1.08s"/><circle class="dot" cx="330" cy="250" r="4.5" style="animation-delay:1.16s"/>
    <circle class="dot" cx="341" cy="250" r="4.5" style="animation-delay:1.24s"/><circle class="dot" cx="352" cy="250" r="4.5" style="animation-delay:1.32s"/>
    <circle class="dot" cx="363" cy="250" r="4.5" style="animation-delay:1.40s"/><circle class="dot" cx="374" cy="250" r="4.5" style="animation-delay:1.48s"/>
    <circle class="dot" cx="385" cy="250" r="4.5" style="animation-delay:1.56s"/><circle class="dot" cx="396" cy="250" r="4.5" style="animation-delay:1.64s"/>
    <circle class="dot" cx="407" cy="250" r="4.5" style="animation-delay:1.72s"/>
  </g>
  <text x="248" y="292" class="dim">$2.48 against $3.97</text>
  <text x="50" y="326" class="dim">Solved 15 of 15 runs, against 14 of 15.</text>

  <!-- against Codex CLI -->
  <rect x="448" y="62" width="404" height="284" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="470" y="96" class="ttl">vs Codex CLI</text>
  <text x="832" y="96" text-anchor="end" class="dim">one 10-turn session, one run</text>

  <g class="up d3">
    <text x="468" y="186" class="big" font-size="80" fill="url(#g3)">41%</text>
    <text x="470" y="216" class="lab">fewer input tokens</text>
  </g>
  <rect x="470" y="238" width="170" height="8" rx="4" fill="#3a424d"/>
  <rect class="bar b3" x="470" y="254" width="100" height="8" rx="4" fill="url(#g3)"/>
  <text x="470" y="292" class="dim">3.86M against 6.53M</text>

  <g class="up d4">
    <text x="668" y="186" class="big" font-size="80" fill="url(#g4)">0</text>
    <text x="670" y="216" class="lab">compactions</text>
  </g>
  <rect x="670" y="238" width="150" height="8" rx="4" fill="#3a424d"/>
  <rect class="bar b4" x="670" y="254" width="96" height="8" rx="4" fill="url(#g4)"/>
  <text x="670" y="292" class="dim">27 calls against 42</text>
  <text x="470" y="326" class="dim">Codex CLI compacted twice and did not solve it. nexo did.</text>

  <text x="440" y="378" text-anchor="middle" class="dim">Grey bar: the other tool. Colour: nexo. Dates, limits and every run are under Proof.</text>
</svg>
