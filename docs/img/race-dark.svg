<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f58518"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a19" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="610" fill="#1a1a19"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#f0efec">Same model, five harnesses: TB-MINI, 16 tasks, 1 attempt per task and arm</text>

  <!-- Panel 1 -->
  <text x="270" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#f0efec">Pass rate (95% Wilson interval), n=16 per bar</text>
  <g stroke="#383835" stroke-width="1">
    <line x1="70" y1="380" x2="470" y2="380"/><line x1="70" y1="305" x2="470" y2="305"/>
    <line x1="70" y1="230" x2="470" y2="230"/><line x1="70" y1="155" x2="470" y2="155"/><line x1="70" y1="80" x2="470" y2="80"/>
  </g>
  <line x1="70" y1="80" x2="70" y2="380" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="70" y1="380" x2="470" y2="380" stroke="#c3c2b7" stroke-width="1.5"/>
  <g font-size="12" fill="#c3c2b7" text-anchor="end">
    <text x="64" y="384">0%</text><text x="64" y="309">25%</text><text x="64" y="234">50%</text><text x="64" y="159">75%</text><text x="64" y="84">100%</text>
  </g>
  <!-- nexo -->
  <rect x="80" y="137" width="30" height="243" fill="#4c78a8"/>
  <rect x="112" y="173" width="30" height="207" fill="#f58518"/>
  <!-- codex -->
  <rect x="156" y="137" width="30" height="243" fill="#4c78a8"/>
  <rect x="188" y="116" width="30" height="264" fill="#f58518"/>
  <!-- cc -->
  <rect x="232" y="155" width="30" height="225" fill="#4c78a8"/>
  <rect x="264" y="155" width="30" height="225" fill="#f58518"/>
  <!-- hermes (B cap not observed) -->
  <rect x="308" y="155" width="30" height="225" fill="#4c78a8"/>
  <rect x="340" y="155" width="30" height="225" fill="url(#hatch)" stroke="#f0a060" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- dsh (B cap not observed) -->
  <rect x="384" y="137" width="30" height="243" fill="#4c78a8"/>
  <rect x="416" y="173" width="30" height="207" fill="url(#hatch)" stroke="#f0a060" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- error bars -->
  <g stroke="#f0efec" stroke-width="1.5">
    <line x1="95" y1="101" x2="95" y2="209"/><line x1="91" y1="101" x2="99" y2="101"/><line x1="91" y1="209" x2="99" y2="209"/>
    <line x1="127" y1="122" x2="127" y2="248"/><line x1="123" y1="122" x2="131" y2="122"/><line x1="123" y1="248" x2="131" y2="248"/>
    <line x1="171" y1="101" x2="171" y2="209"/><line x1="167" y1="101" x2="175" y2="101"/><line x1="167" y1="209" x2="175" y2="209"/>
    <line x1="203" y1="89" x2="203" y2="188"/><line x1="199" y1="89" x2="207" y2="89"/><line x1="199" y1="188" x2="207" y2="188"/>
    <line x1="247" y1="110" x2="247" y2="227"/><line x1="243" y1="110" x2="251" y2="110"/><line x1="243" y1="227" x2="251" y2="227"/>
    <line x1="279" y1="110" x2="279" y2="227"/><line x1="275" y1="110" x2="283" y2="110"/><line x1="275" y1="227" x2="283" y2="227"/>
    <line x1="323" y1="110" x2="323" y2="227"/><line x1="319" y1="110" x2="327" y2="110"/><line x1="319" y1="227" x2="327" y2="227"/>
    <line x1="355" y1="110" x2="355" y2="227"/><line x1="351" y1="110" x2="359" y2="110"/><line x1="351" y1="227" x2="359" y2="227"/>
    <line x1="399" y1="101" x2="399" y2="209"/><line x1="395" y1="101" x2="403" y2="101"/><line x1="395" y1="209" x2="403" y2="209"/>
    <line x1="431" y1="122" x2="431" y2="248"/><line x1="427" y1="122" x2="435" y2="122"/><line x1="427" y1="248" x2="435" y2="248"/>
  </g>
  <g font-size="13" fill="#f0efec" text-anchor="middle">
    <text x="111" y="400">nexo</text><text x="187" y="400">Codex</text><text x="263" y="400">Claude Code</text><text x="339" y="400">Hermes</text><text x="415" y="400">dsh</text>
  </g>
  <!-- solved/attempts under each bar -->
  <g font-size="11" text-anchor="middle">
    <g fill="#8fb8e6">
      <text x="111" y="416">A 13/16</text><text x="187" y="416">A 13/16</text><text x="263" y="416">A 12/16</text><text x="339" y="416">A 12/16</text><text x="415" y="416">A 13/16</text>
    </g>
    <g fill="#f0a060">
      <text x="111" y="430">B 11/16</text><text x="187" y="430">B 14/16</text><text x="263" y="430">B 12/16</text><text x="339" y="430">B 12/16</text><text x="415" y="430">B 11/16</text>
    </g>
  </g>
  <text x="760" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#f0efec">Cost per solved task (USD, DeepSeek price table)</text>
  <g stroke="#383835" stroke-width="1">
    <line x1="560" y1="380" x2="960" y2="380"/><line x1="560" y1="305" x2="960" y2="305"/>
    <line x1="560" y1="230" x2="960" y2="230"/><line x1="560" y1="155" x2="960" y2="155"/><line x1="560" y1="80" x2="960" y2="80"/>
  </g>
  <line x1="560" y1="80" x2="560" y2="380" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="560" y1="380" x2="960" y2="380" stroke="#c3c2b7" stroke-width="1.5"/>
  <g font-size="12" fill="#c3c2b7" text-anchor="end">
    <text x="554" y="384">0</text><text x="554" y="309">0.015</text><text x="554" y="234">0.030</text><text x="554" y="159">0.045</text><text x="554" y="84">0.060</text>
  </g>
  <rect x="570" y="200" width="30" height="180" fill="#4c78a8"/><rect x="602" y="175" width="30" height="205" fill="#f58518"/>
  <rect x="646" y="155" width="30" height="225" fill="#4c78a8"/><rect x="678" y="200" width="30" height="180" fill="#f58518"/>
  <rect x="722" y="135" width="30" height="245" fill="#4c78a8"/><rect x="754" y="125" width="30" height="255" fill="#f58518"/>
  <rect x="798" y="255" width="30" height="125" fill="#4c78a8"/><rect x="830" y="245" width="30" height="135" fill="url(#hatch)" stroke="#f0a060" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="874" y="215" width="30" height="165" fill="#4c78a8"/><rect x="906" y="175" width="30" height="205" fill="url(#hatch)" stroke="#f0a060" stroke-width="1.5" stroke-dasharray="4 3"/>
  <g font-size="12" fill="#f0efec" text-anchor="middle">
    <text x="585" y="194">0.036</text><text x="617" y="169">0.041</text>
    <text x="661" y="149">0.045</text><text x="693" y="194">0.036</text>
    <text x="737" y="129">0.049</text><text x="769" y="119">0.051</text>
    <text x="813" y="249">0.025</text><text x="845" y="239">0.027</text>
    <text x="889" y="209">0.033</text><text x="921" y="169">0.041</text>
  </g>
  <g font-size="13" fill="#f0efec" text-anchor="middle">
    <text x="601" y="400">nexo</text><text x="677" y="400">Codex</text><text x="753" y="400">Claude Code</text><text x="829" y="400">Hermes</text><text x="905" y="400">dsh</text>
  </g>

  <!-- Legend -->
  <rect x="300" y="440" width="16" height="16" fill="#4c78a8"/><text x="322" y="453" font-size="13" fill="#f0efec">Round A: each harness's defaults</text>
  <rect x="580" y="440" width="16" height="16" fill="#f58518"/><text x="602" y="453" font-size="13" fill="#f0efec">Round B: common 131072-token window</text>
  <rect x="300" y="466" width="16" height="16" fill="url(#hatch)" stroke="#f0a060" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="322" y="479" font-size="13" fill="#f0efec">Hatched = round B cap not observed (Hermes, dsh: config applied, no compaction or readout seen)</text>

  <!-- Caption -->
  <g font-size="12" fill="#c3c2b7">
    <text x="30" y="515">Model deepseek-flash via the DeepSeek API, 2026-11-09. TB-MINI (16 Terminal-Bench tasks), 1 valid attempt per task and arm in both rounds.</text>
    <text x="30" y="533">Round B was run at 1 rep. nexo = commit b99d96c, curator on (it never acted). Codex cap verified (window 124518); Claude Code compacted once.</text>
    <text x="30" y="551">Intervals overlap for every pair: differences are 1 or 2 tasks. Arms ran concurrently on one 14-core host; Codex started first, under lighter load.</text>
    <text x="30" y="569">One price table for all arms: 0.30 in, 0.006 cached in, 1.20 out per M tokens. Axes start at 0. Total spent 5.38 USD (extras and session-ops included).</text>
    <text x="30" y="587">Excluded from bars: 68 start failures (46 in A, 22 in B), 21 extra valid attempts, 0 balance (HTTP 402) failures.</text>
  </g>
</svg>
