  <text x="330" y="530" text-anchor="middle" font-size="11" fill="#c3c2b7">1.00</text>
  <g font-size="12" fill="#c3c2b7">
    <text x="30" y="548">Model deepseek-flash via the DeepSeek API, 2026-11-09, nexo b99d96c (before epochs). 16 Terminal-Bench tasks, one attempt per task and arm.</text>
    <text x="30" y="566">Steps, tokens (input plus output) and cost are summed over the 8 common tasks, using each arm's first solved attempt. The 8 tasks differ between rounds.</text>
    <text x="30" y="584">One price for every arm: 0.30 $ input, 0.006 $ cached input, 1.20 $ output per million tokens. Solved of 16 is context: the pass rates tie within noise.</text>
    <text x="30" y="602">In round B the curator never acted: nexo's lead there comes from short prompts and a stable prefix. Method and all tables: docs/results.md.</text>
  </g>
