<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">Same model, two harnesses: nexo against Codex CLI</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#555555">One long session of 10 turns with 865,000 characters pasted. Solved or not, then calls, tokens and dollars.</text>
  <text x="400" y="132" text-anchor="end" font-size="64" font-weight="bold" fill="#4c78a8">yes</text>
  <text x="500" y="128" text-anchor="middle" font-size="22" fill="#555555">vs</text>
  <text x="600" y="132" text-anchor="start" font-size="64" font-weight="bold" fill="#222222">no</text>
  <text x="400" y="156" text-anchor="end" font-size="14" fill="#555555">nexo solved it</text>
  <text x="600" y="156" text-anchor="start" font-size="14" fill="#555555">Codex CLI did not: it compacted twice</text>
  <text x="400" y="174" text-anchor="end" font-size="14" fill="#555555">0 compactions</text>
  <text x="600" y="174" text-anchor="start" font-size="14" fill="#555555">and lost five values from the first two turns</text>
  <line x1="190" y1="186" x2="190" y2="410" stroke="#555555" stroke-width="1.5"/>
  <text x="180" y="212" text-anchor="end" font-size="14" font-weight="bold" fill="#222222">Model calls</text>
  <rect x="190" y="194" width="360" height="24" fill="#4c78a8"/>
  <text x="558" y="212" font-size="14" font-weight="bold" fill="#222222">27</text>
  <rect x="190" y="222" width="560" height="24" fill="#b4b9c0"/>
  <text x="758" y="240" font-size="14" fill="#222222">42</text>
  <text x="180" y="304" text-anchor="end" font-size="14" font-weight="bold" fill="#222222">Input tokens</text>
  <rect x="190" y="276" width="331" height="24" fill="#4c78a8"/>
  <text x="529" y="294" font-size="14" font-weight="bold" fill="#222222">3.86M</text>
  <rect x="190" y="304" width="560" height="24" fill="#b4b9c0"/>
  <text x="758" y="322" font-size="14" fill="#222222">6.53M</text>
  <text x="180" y="386" text-anchor="end" font-size="14" font-weight="bold" fill="#222222">List price</text>
  <rect x="190" y="358" width="420" height="24" fill="#4c78a8"/>
  <text x="618" y="376" font-size="14" font-weight="bold" fill="#222222">$0.204</text>
  <rect x="190" y="386" width="560" height="24" fill="#b4b9c0"/>
  <text x="758" y="404" font-size="14" fill="#222222">$0.272</text>
  <text x="500" y="444" text-anchor="middle" font-size="12" fill="#555555">same model (gpt-5.6-luna), task marathon-pasted, one run per tool.</text>
</svg>
