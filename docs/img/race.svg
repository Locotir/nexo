  <text x="512" y="501.0" font-size="14" font-weight="bold" fill="#222222">1.97</text>
  <g font-size="13" fill="#222222" text-anchor="end"><text x="640" y="501.0">90</text><text x="750" y="501.0">1.75M</text><text x="850" y="501.0">$0.107</text><text x="960" y="501.0">11</text></g>
  <text x="330" y="530" text-anchor="middle" font-size="11" fill="#555555">1.00</text>
  <g font-size="12" fill="#333333">
    <text x="30" y="548">Model deepseek-flash via the DeepSeek API, 2026-11-09, nexo b99d96c (before epochs). 16 Terminal-Bench tasks, one attempt per task and arm.</text>
    <text x="30" y="566">Of the 8 tasks every harness solved in each round, tasks where an agent downloaded the benchmark's own solutions or tests are left out for all arms.</text>
    <text x="30" y="584">Steps, tokens (input plus output) and cost are summed over the kept tasks, first solved attempt. One price for every arm: 0.30 $ input, 0.006 $ cached input, 1.20 $ output per million tokens.</text>
    <text x="30" y="602">In round B the curator never acted: nexo's lead there comes from short prompts and a stable prefix. Method and all tables: docs/results.md.</text>
  </g>
</svg>
