  <text x="30" y="320" font-size="14" font-weight="bold" fill="#222222">Round B: common 131k-token window (6 tasks)</text>
  <text x="640" y="320" text-anchor="end" font-size="12" fill="#555555">steps</text>
  <text x="750" y="320" text-anchor="end" font-size="12" fill="#555555">tokens</text>
