<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<rect width="760" height="350" fill="#fcfcfb"/>
<text x="16" y="18" fill="#0b0b0b" font-size="14" font-weight="600">Live on DeepSeek: what the curator saves against sending the whole history</text>
<text x="16" y="36" fill="#52514e">Interleaved arms, 10 to 11 runs each over 5 tasks. Solved: whole history 10/10, curator 9/10, curator + directives 8/11.</text>
<line x1="150.0" y1="50" x2="150.0" y2="280" stroke="#e1e0d9"/><text x="150.0" y="296" fill="#52514e" text-anchor="middle">0% (whole history)</text>
<line x1="260.0" y1="50" x2="260.0" y2="280" stroke="#e1e0d9"/><text x="260.0" y="296" fill="#52514e" text-anchor="middle">-20%</text>
<line x1="370.0" y1="50" x2="370.0" y2="280" stroke="#e1e0d9"/><text x="370.0" y="296" fill="#52514e" text-anchor="middle">-40%</text>
<line x1="480.0" y1="50" x2="480.0" y2="280" stroke="#e1e0d9"/><text x="480.0" y="296" fill="#52514e" text-anchor="middle">-60%</text>
<line x1="590.0" y1="50" x2="590.0" y2="280" stroke="#e1e0d9"/><text x="590.0" y="296" fill="#52514e" text-anchor="middle">-80%</text>
<text x="138" y="73.0" fill="#0b0b0b" text-anchor="end" font-weight="600">tokens sent</text>
<rect x="150" y="54.0" width="330.0" height="16" rx="3" fill="#8fb9ea"/><text x="486.0" y="66.0" fill="#52514e">-60%  curator alone</text>
<rect x="150" y="76.0" width="396.0" height="16" rx="3" fill="#2a78d6"/><text x="552.0" y="88.0" fill="#0b0b0b" font-weight="600">-72%  curator + directives</text>
<text x="138" y="133.0" fill="#0b0b0b" text-anchor="end" font-weight="600">cost</text>
<rect x="150" y="114.0" width="231.0" height="16" rx="3" fill="#8fb9ea"/><text x="387.0" y="126.0" fill="#52514e">-42%  curator alone</text>
<rect x="150" y="136.0" width="324.5" height="16" rx="3" fill="#2a78d6"/><text x="480.5" y="148.0" fill="#0b0b0b" font-weight="600">-59%  curator + directives</text>
<text x="138" y="193.0" fill="#0b0b0b" text-anchor="end" font-weight="600">wall time</text>
<rect x="150" y="174.0" width="60.5" height="16" rx="3" fill="#8fb9ea"/><text x="216.5" y="186.0" fill="#52514e">-11%  curator alone</text>
<rect x="150" y="196.0" width="225.5" height="16" rx="3" fill="#2a78d6"/><text x="381.5" y="208.0" fill="#0b0b0b" font-weight="600">-41%  curator + directives</text>
<text x="138" y="253.0" fill="#0b0b0b" text-anchor="end" font-weight="600">model calls</text>
<rect x="150" y="234.0" width="5.5" height="16" rx="3" fill="#8fb9ea"/><text x="161.5" y="246.0" fill="#52514e">-1%  curator alone</text>
<rect x="150" y="256.0" width="126.5" height="16" rx="3" fill="#2a78d6"/><text x="282.5" y="268.0" fill="#0b0b0b" font-weight="600">-23%  curator + directives</text>
<rect x="150" y="332" width="12" height="12" rx="2" fill="#8fb9ea"/><text x="168" y="342" fill="#52514e">curator alone</text>
<rect x="270" y="332" width="12" height="12" rx="2" fill="#2a78d6"/><text x="288" y="342" fill="#52514e">curator + directives (opt-in)</text>
<text x="500" y="342" fill="#898781">earlier implementation, data unpublished</text>
</svg>
