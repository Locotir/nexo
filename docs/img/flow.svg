<rect class="hb" x="40" y="256" width="70" height="8" rx="2"/>
<rect class="hn" x="40" y="268" width="136" height="8" rx="2"/>
<rect class="hb" x="40" y="280" width="104" height="8" rx="2"/>
<rect class="hb" x="40" y="292" width="146" height="8" rx="2"/>
<rect class="hb" x="40" y="304" width="120" height="8" rx="2"/>
<rect class="hn" x="40" y="316" width="150" height="8" rx="2"/>
