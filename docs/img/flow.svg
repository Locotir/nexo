<path class="ar" d="M218 219h16m-5-5l5 5-5 5"/>
<rect class="cur" x="238" y="80" width="270" height="278" rx="6"/>
<text x="254" y="104" class="t1" font-weight="600">nexo curator</text>
<rect class="dot" x="254" y="121" width="6" height="6" rx="1"/><text x="268" y="128" class="t1" font-weight="600">Squeeze at birth</text><text x="268" y="141" class="t3" font-size="11">progress bars and repeats never enter</text>
<rect class="dot" x="254" y="147" width="6" height="6" rx="1"/><text x="268" y="154" class="t1" font-weight="600">One thread per goal</text><text x="268" y="167" class="t3" font-size="11">a finished goal becomes a frozen card</text>
<rect class="dot" x="254" y="173" width="6" height="6" rx="1"/><text x="268" y="180" class="t1" font-weight="600">Closing priced by need</text><text x="268" y="193" class="t3" font-size="11">a step stays if a later reply likely needs it</text>
<rect class="dot" x="254" y="199" width="6" height="6" rx="1"/><text x="268" y="206" class="t1" font-weight="600">Rewrite at epochs, when it pays</text><text x="268" y="219" class="t3" font-size="11">growth costs more than a new prefix</text>
<rect class="dot" x="254" y="225" width="6" height="6" rx="1"/><text x="268" y="232" class="t1" font-weight="600">An anchor that never drops</text><text x="268" y="245" class="t3" font-size="11">rules, notes, pins, ledger, map</text>
<rect class="dot" x="254" y="251" width="6" height="6" rx="1"/><text x="268" y="258" class="t1" font-weight="600">Stale reads go first</text><text x="268" y="271" class="t3" font-size="11">a file read before it was edited</text>
<rect class="dot" x="254" y="277" width="6" height="6" rx="1"/><text x="268" y="284" class="t1" font-weight="600">A named line comes back</text><text x="268" y="297" class="t3" font-size="11">what the request names is read back</text>
<rect class="dot" x="254" y="303" width="6" height="6" rx="1"/><text x="268" y="310" class="t1" font-weight="600">Cache pockets (opt-in)</text><text x="268" y="323" class="t3" font-size="11">one cached view per topic</text>
<rect class="dot" x="254" y="329" width="6" height="6" rx="1"/><text x="268" y="336" class="t1" font-weight="600">Resume = same view</text><text x="268" y="349" class="t3" font-size="11">reopen a session, the cache still hits</text>
<path class="ar" d="M512 219h16m-5-5l5 5-5 5"/>
<rect class="tile" x="532" y="80" width="204" height="278" rx="6"/>
<text x="548" y="104" class="t1" font-weight="600">The model gets</text>
<text x="548" y="121" class="t3" font-size="11">the view for the next step</text>
<rect class="sys" x="548" y="132" width="172" height="18" rx="4"/><text x="558" y="145" class="t2" font-size="11">prompt (compact if window 32k)</text>
<rect class="sys" x="548" y="154" width="172" height="18" rx="4"/><text x="558" y="167" class="t2" font-size="11">Project block: tree, commands</text>
<rect class="anc" x="548" y="178" width="172" height="24" rx="4"/>
<text x="558" y="194" class="t1" font-size="11">anchor: your rules, notes, pins</text>
<rect class="card" x="548" y="208" width="172" height="18" rx="4"/>
<text x="558" y="221" class="t2" font-size="11">card: an earlier goal</text>
<rect class="card" x="548" y="230" width="172" height="18" rx="4"/>
<text x="558" y="243" class="t2" font-size="11">card: another goal</text>
<rect class="rb" x="548" y="258" width="160" height="8" rx="2"/>
<rect class="rb" x="548" y="270" width="118" height="8" rx="2"/>
<rect class="rb" x="548" y="282" width="172" height="8" rx="2"/>
<text x="548" y="312" class="t3" font-size="11">plus the current goal's work.</text>
<text x="548" y="326" class="t3" font-size="11">What left is listed, with how</text>
<text x="548" y="338" class="t3" font-size="11">to read it back.</text>
<text x="24" y="380" class="t1" font-weight="600">Around each call</text>
<text x="24" y="398" class="t2" font-size="11.5">Reasoning only: a reply that reasons past its budget with no answer or call is cut, then asked to go on.</text>
<text x="24" y="414" class="t2" font-size="11.5">Steps in one reply run in order, reads and searches together; a failed step stops the ones after it.</text>
<text x="24" y="430" class="t2" font-size="11.5">web_search: two refusals in a row switch it off for two minutes, and the model is told not to retry.</text>
<text x="24" y="454" class="t2">Cold test, 1,000 topics, 128k window (2026-11-09, nexo cdeb98a): recall 100%, prefix hit 99.4%, $0.59 against $2.41 whole history.</text>
</svg>
