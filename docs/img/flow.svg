<rect class="bg" width="760" height="466" rx="8"/>
<text x="24" y="36" class="t1" font-size="18" font-weight="600">Where the curator sits</text>
<text x="24" y="57" class="t2">The whole history stays on disk. Every call, the model gets a view built for its next step.</text>
