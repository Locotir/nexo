.bg{fill:#fcfcfb}.tile{fill:#f3f2ee}.cur{fill:#eef4fc;stroke:#2a78d6;stroke-width:1.5}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#76756f}
.hb{fill:#bdbcb4}.hn{fill:#dddcd5}.dot{fill:#2a78d6}.ar{stroke:#898781;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.anc{fill:#d9e7f9;stroke:#2a78d6}.sys{fill:#e4e3de}.card{fill:none;stroke:#2a78d6;stroke-dasharray:3 2}.rb{fill:#8f8e86}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.tile{fill:#242422}.cur{fill:#1d2733;stroke:#4f93e6}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#9c9b93}
