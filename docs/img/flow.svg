<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Where the curator sits</title>
<desc id="d">The whole history stays on disk. On every call the nexo curator builds the view for the next step: it squeezes noise at birth, keeps one thread per goal, keeps or sets aside each finished step by whether a later reply will need it, rewrites the view only at an epoch (when keeping growth costs more than a new prefix, or at 95% of the window), keeps an anchor that never drops, drops stale reads first, brings back a line the request names, can keep a cached view per topic, and gives a resumed session the same view. The model gets the system prompt (the compact one for windows of 32k or less), the Project block, the anchor, cards of earlier goals and the recent work. Around each call: a reply that only reasons is cut and the model asked to go on, steps in one reply run in order and a failed one stops the rest, and web_search stops after two refusals in a row.</desc>
