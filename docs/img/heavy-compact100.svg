<title id="t">A heavy session: compaction at 100k against the nexo curator</title>
<desc id="d">marathon-heavy, three runs per arm. Compaction at 100k solved 1 of 3 runs at a mean cost of 0.340 dollars; the curator solved 3 of 3 at 0.169 dollars. Largest request 134k tokens against 93k. In run 1 compaction summarised 28 times and hit the step cap; in run 2 its summary lost a fact the last request needed.</desc>
