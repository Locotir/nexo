<text x="254" y="104" fill="#f0efec" font-weight="600">nexo curator</text>
<rect fill="#4f93e6" x="254" y="121" width="6" height="6" rx="1"/><text x="268" y="128" fill="#f0efec" font-weight="600">Squeeze at birth</text><text x="268" y="141" fill="#9c9b93" font-size="11">progress bars and repeats never enter</text>
<rect fill="#4f93e6" x="254" y="150" width="6" height="6" rx="1"/><text x="268" y="157" fill="#f0efec" font-weight="600">Between epochs, it only grows</text><text x="268" y="170" fill="#9c9b93" font-size="11">nothing before the tail changes, the cache hits</text>
<rect fill="#4f93e6" x="254" y="179" width="6" height="6" rx="1"/><text x="268" y="186" fill="#f0efec" font-weight="600">Epoch, when it pays or at 95%</text><text x="268" y="199" fill="#9c9b93" font-size="11">growth costs more than a new prefix</text>
<rect fill="#4f93e6" x="254" y="208" width="6" height="6" rx="1"/><text x="268" y="215" fill="#f0efec" font-weight="600">At an epoch, one batch</text><text x="268" y="228" fill="#9c9b93" font-size="11">answered steps leave by need, stale reads first</text>
<rect fill="#4f93e6" x="254" y="237" width="6" height="6" rx="1"/><text x="268" y="244" fill="#f0efec" font-weight="600">An anchor that never drops</text><text x="268" y="257" fill="#9c9b93" font-size="11">rules, notes, pins, ledger, map</text>
<rect fill="#4f93e6" x="254" y="266" width="6" height="6" rx="1"/><text x="268" y="273" fill="#f0efec" font-weight="600">A tail for each call</text><text x="268" y="286" fill="#9c9b93" font-size="11">standing facts, lines the request names</text>
<rect fill="#4f93e6" x="254" y="295" width="6" height="6" rx="1"/><text x="268" y="302" fill="#f0efec" font-weight="600">recall m00042</text><text x="268" y="315" fill="#9c9b93" font-size="11">brings back a message as it was</text>
<rect fill="#4f93e6" x="254" y="324" width="6" height="6" rx="1"/><text x="268" y="331" fill="#f0efec" font-weight="600">Cache pockets (opt-in)</text><text x="268" y="344" fill="#9c9b93" font-size="11">one cached view per topic</text>
