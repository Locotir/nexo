<svg xmlns="http://www.w3.org/2000/svg" width="760" height="466" viewBox="0 0 760 466" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">Where the curator sits</title>
<desc id="d">The whole history stays on disk and each message is indexed once. For each call the nexo curator builds the view. Process output is squeezed when it arrives. Between epochs the view only grows at its end, so the cached prefix holds. At an epoch, when keeping the growth costs more than a new prefix or the view reaches 95% of the window, answered steps leave by need, stale reads go first and the view is cut to the target. The anchor of rules, notes, pins, ledger and map never drops. The tail, built for each call, holds standing facts and the lines the request names, and the recall tool brings a message back by name. The model gets the system prompt (the compact one for windows of 32k or less), the Project block, the anchor, the view and the tail. Around each call: a reply that only reasons is cut and the model asked to go on, steps in one reply run in order and a failed one stops the rest, and web_search stops after two refusals in a row.</desc>
<rect fill="#1a1a19" width="760" height="466" rx="8"/>
<text x="24" y="36" fill="#f0efec" font-size="18" font-weight="600">Where the curator sits</text>
<text x="24" y="57" fill="#c3c2b7">The whole history stays on disk. Every call, the model gets a view built for its next step.</text>
<rect fill="#242422" x="24" y="80" width="190" height="278" rx="6"/>
