<rect fill="#363633"  x="548" y="154" width="172" height="18" rx="4"/>
<text x="558" y="167.0" fill="#c3c2b7" font-size="11">Project block: tree, commands</text>
<rect fill="#22364f"  x="548" y="178" width="172" height="24" rx="4"/>
<text x="558" y="194.0" fill="#f0efec" font-size="11">anchor: rules, notes, pins</text>
<rect fill="#55544f" x="548" y="212" width="160" height="8" rx="2"/>
<rect fill="#55544f" x="548" y="224" width="118" height="8" rx="2"/>
<rect fill="#55544f" x="548" y="236" width="172" height="8" rx="2"/>
<rect fill="#55544f" x="548" y="248" width="140" height="8" rx="2"/>
<rect fill="#55544f" x="548" y="260" width="168" height="8" rx="2"/>
<text x="548" y="286" fill="#9c9b93" font-size="11">requests, replies, kept steps</text>
<text x="548" y="299" fill="#9c9b93" font-size="11">grow at the end, cached</text>
<rect fill="none" stroke="#4f93e6" stroke-dasharray="3 2" x="548" y="310" width="172" height="36" rx="4"/>
<text x="558" y="326" fill="#f0efec" font-size="11">tail, new each call:</text><text x="558" y="339" fill="#c3c2b7" font-size="11">Standing: and Recall: lines</text>
<text x="24" y="380" fill="#f0efec" font-weight="600">Around each call</text>
<text x="24" y="398" fill="#c3c2b7" font-size="11.5">Reasoning only: a reply that reasons past its budget with no answer or call is cut, then asked to go on.</text>
<text x="24" y="414" fill="#c3c2b7" font-size="11.5">Steps in one reply run in order, reads and searches together; a failed step stops the ones after it.</text>
<text x="24" y="430" fill="#c3c2b7" font-size="11.5">web_search: two refusals in a row switch it off for two minutes, and the model is told not to retry.</text>
<text x="24" y="454" fill="#c3c2b7">Cold test, 1,000 topics, 128k window (2026-11-09, nexo cdeb98a): recall 100%, prefix hit 99.4%, $0.59 against $2.41 whole history.</text>
</svg>
