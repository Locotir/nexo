# Comment "@nexo fix the typo in the README" on an issue or pull request. Only people with write access
# can trigger it. On a pull request nexo pushes a commit; on an issue it opens a pull request.
name: nexo
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  nexo:
    # cheap pre-filter; the action checks the commenter's access again through the API
    if: contains(github.event.comment.body, '@nexo') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: Locotir/nexo@main
        with:
          mode: comment
          provider: anthropic
          api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          max_turns: "30"
